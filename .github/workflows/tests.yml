name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v
      # There's no LLM in CI, so run the whole pipeline end to end with the
      # fake model to prove the plumbing works.
      - name: Smoke test with the fake model
        run: python -m lab --fake --trials 1 --out ci-results
